<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股投研中心</title>
<style>
  :root {
    --bg: #f8f9fa;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6c757d;
    --border: #e9ecef;
    --red: #dc3545;
    --blue: #2563eb;
    --orange: #fd7e14;
    --purple: #7c3aed;
    --teal: #0d9488;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 650px; margin: 0 auto; }
  .header {
    text-align: center;
    padding: 30px 20px 20px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .header p {
    color: var(--text-secondary);
    font-size: 14px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    padding: 24px 20px;
    margin-bottom: 16px;
    display: block;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s, box-shadow 0.15s;
    border: 1px solid var(--border);
  }
  .card:active { transform: scale(0.98); }
  .card-icon { font-size: 28px; margin-bottom: 8px; }
  .card-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .card-meta {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-red { background: #fde8e8; color: var(--red); }
  .badge-blue { background: #e7f0ff; color: var(--blue); }
  .badge-teal { background: #e0f5f3; color: var(--teal); }
  .badge-orange { background: #fff0e0; color: var(--orange); }
  .card-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .card-icon-wrap {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .bg-red { background: #fde8e8; }
  .bg-blue { background: #e7f0ff; }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 8px 0 4px;
  }
  .tool-card {
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    padding: 24px 20px;
    margin-bottom: 16px;
    display: block;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s, box-shadow 0.15s;
    border: 1px solid var(--border);
  }
  .tool-card:active { transform: scale(0.98); }
  .divider {
    border-top: 1px solid var(--border);
    margin: 20px 0 16px;
  }
  .footer {
    text-align: center;
    padding: 24px 0 10px;
    color: var(--text-secondary);
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>A股投研中心</h1>
    <p>群聊观点汇总 / 个股逻辑数据库 &middot; 更新于 2026-09-04</p>
  </div>

  <div class="section-title">今日观点</div>

  <a class="card" href="reports/2026-09-04_summary.html">
    <div class="card-row">
      <div class="card-icon-wrap bg-red">📊</div>
      <div style="flex:1;">
        <div class="card-title">今日市场观点汇总</div>
        <div class="card-desc">15个飞书群聊消息整理，大盘走势、板块热度、重点个股、情绪分析</div>
      </div>
    </div>
    <div class="card-meta">
      <span class="badge badge-red">今日报告</span>
      <span>2026/09/04</span>
    </div>
  </a>

  <div class="divider"></div>
  <div class="section-title">工具</div>

  <a class="tool-card" href="https://juebro.github.io/sentiment-monitor/">
    <div class="card-row">
      <div class="card-icon-wrap" style="background:#fff0e0;">🔥</div>
      <div style="flex:1;">
        <div class="card-title">板块情绪监控</div>
        <div class="card-desc">60个板块情绪分排行、涨跌停统计、量比换手、代表个股、历史趋势图</div>
      </div>
    </div>
    <div class="card-meta">
      <span class="badge badge-orange">每日更新</span>
      <span>交易日 16:30</span>
    </div>
  </a>

  <a class="tool-card" href="search.html">
    <div class="card-row">
      <div class="card-icon-wrap bg-blue">🔍</div>
      <div style="flex:1;">
        <div class="card-title">个股逻辑数据库</div>
        <div class="card-desc">搜索所有群聊提及的个股和板块，查看炒作逻辑、来源群、情绪标签</div>
      </div>
    </div>
    <div class="card-meta">
      <span class="badge badge-blue">持续积累</span>
      <span>每日自动更新</span>
    </div>
  </a>

  <a class="tool-card" href="https://1130477fe2dd48be910530960804e0e5.app.codebuddy.work">
    <div class="card-row">
      <div class="card-icon-wrap" style="background:#e0f5f3;">📈</div>
      <div style="flex:1;">
        <div class="card-title">复盘情绪分析工具</div>
        <div class="card-desc">情绪温度计、实时行情刷新、统计图表</div>
      </div>
    </div>
    <div class="card-meta">
      <span class="badge badge-teal">工具</span>
    </div>
  </a>

  <div class="footer">
    仅供个人参考，不构成投资建议
  </div>
</div>
</body>
</html>
